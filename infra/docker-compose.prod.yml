version: '3.8'

# ============================================================
#  FiscalAI — Produção (VPS Ubuntu / Hostinger)
#  Reverse proxy: Caddy (SSL automático via Let's Encrypt)
#  Apenas as portas 80 e 443 ficam abertas ao host.
#  Todos os outros serviços ficam na rede interna `fiscalai`.
# ============================================================

services:

  # ===== CADDY (Reverse Proxy + SSL automático) =====
  caddy:
    image: caddy:2-alpine
    container_name: fiscalai-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    networks:
      - fiscalai
    depends_on:
      - frontend
      - backend

  # ===== FRONTEND (React → nginx) =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: fiscalai-frontend
    # Sem ports aqui — Caddy acessa internamente pela rede `fiscalai`
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend

  # ===== BACKEND (FastAPI) =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-backend
    # Sem ports aqui — Caddy acessa internamente pela rede `fiscalai`
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # REMOVIDO: ../backend:/app:ro — na VPS o código está dentro da imagem Docker

  # ===== CELERY WORKER =====
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-celery-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - fiscalai
    # REMOVIDO: ../backend:/app:ro — na VPS o código está dentro da imagem Docker

  # ===== FLOWER (Celery Monitoring) =====
  flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-flower
    command: celery -A app.tasks flower --port=5555
    ports:
      # Acessível apenas localmente — use SSH tunnel para acessar:
      # ssh -L 5555:127.0.0.1:5555 root@89.116.214.246
      - "127.0.0.1:5555:5555"
    env_file:
      - .env.prod
    depends_on:
      - redis
    restart: always
    networks:
      - fiscalai

  # ===== POSTGRESQL DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: fiscalai-postgres
    # Sem ports aqui — somente serviços internos acessam o banco
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiscalai_user} -d ${POSTGRES_DB:-fiscalai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== REDIS CACHE =====
  redis:
    image: redis:7-alpine
    container_name: fiscalai-redis
    # Sem ports aqui — somente serviços internos acessam o Redis
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== MINIO (S3-Compatible Storage) =====
  minio:
    image: minio/minio:latest
    container_name: fiscalai-minio
    ports:
      # Acessível apenas localmente — use SSH tunnel para acessar:
      # ssh -L 9001:127.0.0.1:9001 root@89.116.214.246  → http://localhost:9001
      - "127.0.0.1:9001:9001"
    env_file:
      - .env.prod
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  fiscalai:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
