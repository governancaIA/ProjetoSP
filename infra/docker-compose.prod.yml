version: '3.8'

services:
  # ===== FRONTEND (React + Vite) =====
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: fiscalai-frontend
    ports:
      - "5000:5000"
    environment:
      - VITE_API_URL=https://adriner.fr/sed/api/v1
      - NODE_ENV=production
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend

  # ===== BACKEND (FastAPI) =====
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql://fiscalai_user:FiscalAI#Postgres2026!@postgres:5432/fiscalai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=FiscalAI#MinIO2026!@Secure
      - MINIO_BUCKET=fiscalai-documents
      - CORS_ORIGINS=https://adriner.fr,https://www.adriner.fr,http://localhost:5173
      - SECRET_KEY=k8x!@mP9$vQ2rL5&nJ4wH7cF3bG6yT1Z
      - ALLOWED_HOSTS=adriner.fr,www.adriner.fr,backend,localhost
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ../backend:/app:ro

  # ===== CELERY WORKER =====
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-celery-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    environment:
      - ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql://fiscalai_user:FiscalAI#Postgres2026!@postgres:5432/fiscalai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=FiscalAI#MinIO2026!@Secure
      - MINIO_BUCKET=fiscalai-documents
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - fiscalai
    volumes:
      - ../backend:/app:ro

  # ===== FLOWER (Celery Monitoring) =====
  flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fiscalai-flower
    command: celery -A app.tasks flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
    restart: always
    networks:
      - fiscalai

  # ===== POSTGRESQL DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: fiscalai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fiscalai_user
      POSTGRES_PASSWORD: fiscalai_password
      POSTGRES_DB: fiscalai_db
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=pt_BR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscalai_user -d fiscalai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== REDIS CACHE =====
  redis:
    image: redis:7-alpine
    container_name: fiscalai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== MINIO (S3-Compatible Storage) =====
  minio:
    image: minio/minio:latest
    container_name: fiscalai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
      MINIO_BROWSER_REDIRECT_URL: https://adriner.fr/sed/minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - fiscalai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  fiscalai:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
